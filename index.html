<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Un universo para ti</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="stage">
    <div id="nebula">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
    </div>
    <div id="milkyway"></div>
    <canvas id="sky"></canvas>
    <div id="vignette"></div>
    <div id="curtain"></div>
    <div id="wish"></div>
    <svg id="constellation" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="cosmos">
      <div class="planet"></div>
      <canvas id="flowersCanvas"></canvas>
    </div>
    <div id="flash"></div>

    <div class="frame-top" id="ftop">
      <div class="t1">UN UNIVERSO PARA TI</div>
      <div class="t2">UN LUGAR QUE SÓLO EXISTE CONTIGO</div>
    </div>

    <main id="ui"></main>

    <div class="frame-bottom" id="fbot">
      <span id="chapNum">01</span>
      <span class="rule"></span>
      <span id="chapName">LA NOCHE</span>
    </div>

    <button id="audio" aria-label="Sonido">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path id="audio-icon" d="M11 5 6 9H2v6h4l5 4V5z"/>
        <line id="audio-x1" x1="23" y1="9" x2="17" y2="15"/>
        <line id="audio-x2" x1="17" y1="9" x2="23" y2="15"/>
      </svg>
    </button>
  </div>

  <script src="js/starfield.js"></script>
  <script src="js/flowers.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
